<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="theme-color" media="(prefers-color-scheme: dark)"  content="#0d0d14">
        <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f7f4ef">
        <title>Connexion - LTC App</title>
        <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
        <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet" />
        <link rel="stylesheet" th:href="@{/CSS/auth.css}">
    </head>
    <body>

        <!-- Particles -->
        <div class="particles">
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
        </div>

        <div class="auth-container">
            <div class="auth-header">
                <div class="logo-container">
                    <span class="material-symbols-outlined">favorite</span>
                </div>
                <h1 class="auth-title">LTC App</h1>
                <p class="auth-subtitle">Gérez vos relations en toute confiance</p>
            </div>

            <!--
                Messages d'état injectés par le backend.
                Ils servent à guider l'utilisateur en cas d'échec de connexion,
                de compte non vérifié ou d'action réussie.
            -->

            <div th:if="${errorMessage}" class="alert alert-error" th:text="${errorMessage}"></div>
            <div th:if="${showVerifyLink}" class="alert alert-info">
                <span>Vous pouvez finaliser la vérification de ce compte ici :</span>
                <a th:href="@{/verify-email(email=${loginEmail})}">Vérifier mon email</a>
            </div>

            <div th:if="${param.logout}" class="alert alert-success">
                Vous avez été déconnecté avec succès.
            </div>

            <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>

            <!-- Formulaire d'authentification standard traité par Spring Security. -->
            <form th:action="@{/login}" method="post">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="votre@email.com" th:value="${loginEmail}" required>
                </div>

                <div class="form-group">
                    <label for="password">Mot de passe</label>
                    <input type="password" id="password" name="password" placeholder="••••••••" required>
                    <small class="field-help" style="text-align:right; display:block; margin-top:6px;">
                        <a th:href="@{/forgot-password}" style="color:var(--link-color); font-size:0.83rem;">Mot de passe oublié ?</a>
                    </small>
                </div>

                <button type="submit" class="btn-primary">
                    <span class="material-symbols-outlined">login</span>
                    Se connecter
                </button>
            </form>

            <!-- <div class="auth-links">
                <a th:href="@{/verify-email}">Vérifier mon email</a>
            </div> -->

            <div class="auth-divider" th:if="${googleAuthEnabled}"><span>ou</span></div>

            <a class="btn-google" th:if="${googleAuthEnabled}" th:href="@{/oauth2/authorization/google}">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M21.805 10.023h-9.56v3.955h5.486c-.236 1.271-.955 2.349-2.036 3.069v2.547h3.295c1.929-1.777 3.045-4.394 3.045-7.521 0-.684-.062-1.34-.23-2.05z" fill="#4285F4"/>
                    <path d="M12.245 22c2.756 0 5.072-.913 6.763-2.406l-3.295-2.547c-.914.612-2.08.972-3.468.972-2.65 0-4.897-1.787-5.697-4.19H3.147v2.628A10.208 10.208 0 0 0 12.245 22z" fill="#34A853"/>
                    <path d="M6.548 13.829a6.127 6.127 0 0 1-.32-1.829c0-.637.11-1.254.32-1.829V7.543H3.147A10.196 10.196 0 0 0 2 12c0 1.647.395 3.205 1.147 4.457l3.401-2.628z" fill="#FBBC05"/>
                    <path d="M12.245 5.981c1.498 0 2.836.516 3.893 1.529l2.916-2.915C17.312 2.97 14.996 2 12.245 2A10.208 10.208 0 0 0 3.147 7.543l3.401 2.628c.8-2.403 3.047-4.19 5.697-4.19z" fill="#EA4335"/>
                </svg>
                Continuer avec Google
            </a>
            <div class="auth-footer">
                Pas encore de compte ? <a th:href="@{/register}">Créer un compte</a>
            </div>
        </div>

    </body>
</html>
