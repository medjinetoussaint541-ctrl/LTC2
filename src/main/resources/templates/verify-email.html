<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="theme-color" media="(prefers-color-scheme: dark)"  content="#0d0d14">
        <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f7f4ef">
        <title>Vérification de l’email - LTC App</title>
        <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
        <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,1,0" rel="stylesheet">
        <link rel="stylesheet" th:href="@{/CSS/auth.css}">
    </head>
    <body>

        <!-- Particles -->
        <div class="particles">
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
        </div>

        <div class="verify-wrapper">
            <div class="verify-card">
                <div class="verify-header">
                    <div class="verify-icon" aria-hidden="true">
                        <span class="material-symbols-outlined">mail</span>
                    </div>
                    <h1>Vérifier votre email</h1>
                    <p>
                        Entrez le code reçu par email pour activer votre compte.
                        Si votre code a expiré, vous pouvez en demander un nouveau.
                    </p>
                </div>

                <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
                <div th:if="${warningMessage}" class="alert alert-warning" th:text="${warningMessage}"></div>
                <div th:if="${errorMessage}" class="alert alert-error" th:text="${errorMessage}"></div>

                <form th:action="@{/verify-email}" method="post" class="verify-form">
                    <div class="form-group">
                        <label for="email">Adresse email</label>
                        <input
                                type="email"
                                id="email"
                                name="email"
                                th:value="${email}"
                                placeholder="votreemail@example.com"
                                required>
                    </div>

                    <div class="form-group">
                        <label for="code">Code de vérification</label>
                        <input
                                type="text"
                                id="code"
                                name="code"
                                maxlength="6"
                                inputmode="numeric"
                                autocomplete="one-time-code"
                                class="code-input"
                                placeholder="000000"
                                required>
                        <small class="field-help">
                            Le code expire après
                            <span th:text="${expirationMinutes}">10</span> minutes.
                        </small>
                    </div>

                    <button type="submit" class="btn-primary">
                        Vérifier mon email
                    </button>

                    <button type="submit"
                            class="btn-link-action"
                            th:formaction="@{/verify-email/resend}"
                            formnovalidate>
                        Renvoyer un code
                    </button>
                </form>

                <div class="verify-footer">
                    <a th:href="@{/login}">Retour à la connexion</a>
                </div>
            </div>
        </div>

    </body>
</html>
