<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="theme-color" media="(prefers-color-scheme: dark)"  content="#0d0d14">
        <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f7f4ef">
        <title>Nouveau mot de passe - LTC App</title>
        <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
        <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,1,0" rel="stylesheet">
        <link rel="stylesheet" th:href="@{/CSS/auth.css}">
    </head>
    <body>

        <div class="particles">
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
        </div>

        <div class="verify-wrapper">
            <div class="verify-card">
                <div class="verify-header">
                    <div class="verify-icon" aria-hidden="true">
                        <span class="material-symbols-outlined">lock_reset</span>
                    </div>
                    <h1>Nouveau mot de passe</h1>
                    <p>
                        Choisissez un nouveau mot de passe pour votre compte
                        <strong th:text="${email}"></strong>.
                    </p>
                </div>

                <div th:if="${errorMessage}" class="alert alert-error" th:text="${errorMessage}"></div>

                <form th:action="@{/new-password}" method="post" class="verify-form">
                    <div class="form-group">
                        <label for="newPassword">Nouveau mot de passe</label>
                        <input
                                type="password"
                                id="newPassword"
                                name="newPassword"
                                placeholder="Au moins 8 caractères"
                                autocomplete="new-password"
                                minlength="8"
                                required>
                    </div>

                    <div class="form-group">
                        <label for="confirmPassword">Confirmer le mot de passe</label>
                        <input
                                type="password"
                                id="confirmPassword"
                                name="confirmPassword"
                                placeholder="Répétez votre mot de passe"
                                autocomplete="new-password"
                                minlength="8"
                                required>
                    </div>

                    <button type="submit" class="btn-primary">
                        Enregistrer le mot de passe
                    </button>
                </form>

                <div class="verify-footer">
                    <a th:href="@{/login}">Retour à la connexion</a>
                </div>
            </div>
        </div>

    </body>
</html>
